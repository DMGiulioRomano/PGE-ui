name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: node tests (yaml round-trip · envelope · fingerprint · render-status · history · engine fixtures)
    runs-on: ubuntu-latest
    steps:
      - name: checkout PGE-ui
        uses: actions/checkout@v4
        with:
          path: PGE-ui
      # Stesso motivo del job python, altro consumatore: parte della suite node
      # gira sui config veri del motore (`__dirname/../../..` = root del
      # workspace), e senza il checkout affiancato quelle fixture si skippano —
      # il corpus di round-trip e, da #131, il canarino che verifica che il loop
      # su deviation_probability stia osservando qualcosa. Un test che si skippa
      # e' verde quanto uno che passa: proprio il difetto che la #131 chiude.
      # continue-on-error come sotto: se il token non legge il motore (secret
      # assente/scaduto, PR da un fork) i test si skippano come prima invece di
      # far fallire il job.
      - name: checkout PythonGranularEngine
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: DMGiulioRomano/PythonGranularEngine
          path: PythonGranularEngine
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: run node test suite
        working-directory: PGE-ui
        run: make tests-node

  python:
    name: python tests (render_pipeline · audio_pipeline · engine render)
    runs-on: ubuntu-latest
    steps:
      - name: checkout PGE-ui
        uses: actions/checkout@v4
        with:
          path: PGE-ui
      # The engine lives in a sibling repo; test_engine_render shells out to its
      # venv/main.py. Check it out next to PGE-ui (the layout that test derives
      # from its own path) so the engine smoke test runs here instead of skipping.
      # If PythonGranularEngine is private, add an ENGINE_REPO_TOKEN secret (a PAT
      # with read access); for a public repo the default GITHUB_TOKEN is enough.
      # continue-on-error: when the token can't read the private engine (secret
      # absent/expired, or a fork PR without secrets) the checkout must not fail
      # the whole job — test_engine_render already skips when the engine venv/
      # main.py is absent, so the bridge tests still run and gate the PR.
      - name: checkout PythonGranularEngine
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: DMGiulioRomano/PythonGranularEngine
          path: PythonGranularEngine
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install bridge + test deps
        working-directory: PGE-ui
        run: pip install flask flask-cors pytest PyYAML
      # Build the engine's own venv so test_engine_render runs (instead of
      # skipping on a missing .venv/main.py). numpy renderer needs numpy+soundfile.
      # Skipped implicitly when the checkout above didn't land the engine sources.
      - name: set up engine venv
        continue-on-error: true
        if: hashFiles('PythonGranularEngine/requirements.txt') != ''
        working-directory: PythonGranularEngine
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: run python test suite
        working-directory: PGE-ui
        run: python -m pytest tests/python/ -v
