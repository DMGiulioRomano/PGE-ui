name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: node tests (yaml round-trip · envelope · fingerprint · render-status · history · engine fixtures · parity)
    runs-on: ubuntu-latest
    steps:
      - name: checkout PGE-ui
        uses: actions/checkout@v4
        with:
          path: PGE-ui
      # Stesso motivo del job python, altro consumatore: parte della suite node
      # gira sui config veri del motore (`__dirname/../../..` = root del
      # workspace), e senza il checkout affiancato quelle fixture si skippano —
      # il corpus di round-trip e, da #131, il canarino che verifica che il loop
      # su deviation_probability stia osservando qualcosa. Un test che si skippa
      # e' verde quanto uno che passa: proprio il difetto che la #131 chiude.
      # continue-on-error come sotto: se il token non legge il motore (secret
      # assente/scaduto, PR da un fork) i test si skippano come prima invece di
      # far fallire il job.
      - name: checkout PythonGranularEngine
        id: engine
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: DMGiulioRomano/PythonGranularEngine
          path: PythonGranularEngine
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # L'oracolo di parita' gira su python, quindi la versione va fissata qui
      # come il job python fissa la sua: senza, si userebbe il python3 che
      # l'immagine del runner ha quel giorno. Non sarebbe rotto — con il motore
      # presente la modalita' stretta fa uscire 1 e la CI diventa rossa con
      # "l'oracolo non parte" — ma sarebbe un rosso per un motivo che non
      # c'entra con la parita', deciso da un'immagine che cambia sotto di noi.
      # Nessun venv del motore, che resta la proprieta' che conta.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PGE_REQUIRE_ENGINE_FIXTURES trasforma "motore assente" da SKIP a FAIL,
      # e lo si passa solo quando il checkout sopra ha riportato successo: un
      # checkout riuscito che non lascia i config dove i test li cercano non
      # puo' piu' passare verde saltando le fixture (#132). Se invece il
      # checkout fallisce — secret assente/scaduto, PR da un fork — la
      # variabile resta vuota e le fixture si skippano come prima.
      - name: run node test suite
        working-directory: PGE-ui
        env:
          PGE_REQUIRE_ENGINE_FIXTURES: ${{ steps.engine.outcome == 'success' && '1' || '' }}
        run: make tests-node
      # Parita' JS↔motore (#133): le suite in tests/parity avviano
      # tests/parity/engine_oracle.py, che importa dal motore e risponde a
      # righe JSON. Nessuna delle sue op ha bisogno di numpy/soundfile, quindi
      # il python3 del runner basta e il venv del motore non serve — che e' il
      # motivo per cui questo passo sta qui e non nel job python.
      #
      # Se il checkout sopra e' fallito (fork PR, token assente) le suite
      # saltano rumorosamente ed escono 0, come gia' fanno le fixture
      # `configs/*.yml`. Se invece il motore c'e', l'harness accende da solo la
      # modalita' stretta (CI + motore presente) e un caso saltato diventa
      # rosso: vedi tests/parity/harness.js.
      - name: run parity suite (mirror JS ↔ engine)
        working-directory: PGE-ui
        run: make tests-parity

  python:
    name: python tests (render_pipeline · audio_pipeline · engine render)
    runs-on: ubuntu-latest
    steps:
      - name: checkout PGE-ui
        uses: actions/checkout@v4
        with:
          path: PGE-ui
      # The engine lives in a sibling repo; test_engine_render shells out to its
      # venv/main.py. Check it out next to PGE-ui (the layout that test derives
      # from its own path) so the engine smoke test runs here instead of skipping.
      # If PythonGranularEngine is private, add an ENGINE_REPO_TOKEN secret (a PAT
      # with read access); for a public repo the default GITHUB_TOKEN is enough.
      # continue-on-error: when the token can't read the private engine (secret
      # absent/expired, or a fork PR without secrets) the checkout must not fail
      # the whole job — test_engine_render already skips when the engine venv/
      # main.py is absent, so the bridge tests still run and gate the PR.
      - name: checkout PythonGranularEngine
        id: engine
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: DMGiulioRomano/PythonGranularEngine
          path: PythonGranularEngine
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install bridge + test deps
        working-directory: PGE-ui
        run: pip install flask flask-cors pytest PyYAML
      # Build the engine's own venv so test_engine_render runs (instead of
      # skipping on a missing .venv/main.py). numpy renderer needs numpy+soundfile.
      # Skipped implicitly when the checkout above didn't land the engine sources.
      - name: set up engine venv
        continue-on-error: true
        if: hashFiles('PythonGranularEngine/requirements.txt') != ''
        working-directory: PythonGranularEngine
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      # Stessa cosa del job node: test_yaml_structure.py gira sui config veri del
      # motore e, senza checkout, la parametrize su lista vuota diventa uno skip
      # che non dice niente. Con il checkout riuscito il corpus e' obbligatorio
      # (#132); se il checkout fallisce la variabile resta vuota e si skippa.
      - name: run python test suite
        working-directory: PGE-ui
        env:
          PGE_REQUIRE_ENGINE_FIXTURES: ${{ steps.engine.outcome == 'success' && '1' || '' }}
        run: python -m pytest tests/python/ -v
      # La parita' gira DUE volte in CI, e non per ridondanza: l'oracolo ha due
      # strade per la grammatica di --magnify-at, e possono divergere. Il job
      # node non costruisce il venv del motore, quindi li' vince sempre il ramo
      # ast-slice; qui il venv c'e', `pickPython` lo preferisce, e a girare e' il
      # ramo import — quello che il README chiama piu' fedele e che, fino a
      # questo commit, nessuna CI esercitava mai. Il primo difetto finitoci
      # dentro (il namespace senza le tre costanti) e' arrivato in main verde.
      #
      # Se il venv non e' stato costruito, `pickPython` ripiega su python3 e
      # questo passo replica il job node: ridondante, mai sbagliato.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: run parity suite (ramo import, col venv del motore)
        working-directory: PGE-ui
        env:
          PGE_PARITY_STRICT: ${{ steps.engine.outcome == 'success' && '1' || '' }}
        run: make tests-parity
