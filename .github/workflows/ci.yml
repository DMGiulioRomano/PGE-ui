name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: node tests (yaml round-trip · envelope utils · fingerprint parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: run node test suite
        run: make tests-node

  python:
    name: python tests (render_pipeline · audio_pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install bridge + test deps
        run: pip install flask flask-cors pytest PyYAML
      # The engine-dependent test (test_engine_render) skips itself when the
      # sibling PythonGranularEngine checkout / venv is absent (#46), so the
      # whole suite runs green without the engine here.
      - name: run python test suite
        run: python -m pytest tests/python/ -v
